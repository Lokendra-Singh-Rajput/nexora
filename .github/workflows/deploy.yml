name: Deploy to AWS EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Production EC2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy via Native SSH
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          HOST: ${{ secrets.EC2_HOST }}
          USER: ${{ secrets.EC2_USER }}
        run: |
          echo "Setting up SSH environment..."
          mkdir -p ~/.ssh
          echo "$SSH_KEY" | tr -d '\r' > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key

          # Clean host string (strip whitespace/http)
          CLEAN_HOST=$(echo "$HOST" | sed 's|https://||g' | sed 's|http://||g' | tr -d ' /')
          echo "Connecting to $USER@$CLEAN_HOST..."

          ssh -i ~/.ssh/ec2_key -o StrictHostKeyChecking=no -o ConnectTimeout=15 "$USER@$CLEAN_HOST" << 'EOF'
            set -e
            echo "=========================================="
            echo " Running Deployment on AWS EC2 Server"
            echo "=========================================="
            cd ~/nexora
            git pull origin main
            sudo ./deploy/deploy.sh
            echo "Deployment successfully finished!"
          EOF

      - name: Verify Live Platform Health
        run: |
          echo "Verifying live endpoint..."
          sleep 5
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://nexora-analyst.duckdns.org/health || echo "000")
          if [ "$STATUS" = "200" ] || [ "$STATUS" = "301" ]; then
            echo "Deployment verified! Platform is healthy (HTTP $STATUS)."
          else
            echo "Checking homepage..."
            curl -f -s -I https://nexora-analyst.duckdns.org/ || exit 1
          fi
