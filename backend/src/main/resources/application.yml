server:
  port: 8080

spring:
  application:
    name: nexora-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/nexoradb;DB_CLOSE_DELAY=-1;MODE=MySQL}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: ${SPRING_JPA_DIALECT:org.hibernate.dialect.H2Dialect}
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

analytics:
  service:
    url: ${ANALYTICS_SERVICE_URL:http://localhost:8000}
    connect-timeout-ms: 5000
    read-timeout-ms: 25000

gemini:
  api-key: ${GEMINI_API_KEY:}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
