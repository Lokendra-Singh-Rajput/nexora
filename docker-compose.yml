version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: nexora-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: nexora_db
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_USER: nexora
      MYSQL_PASSWORD: nexorapassword
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/migrations/V1__init_schema.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  analytics-engine:
    build:
      context: ./analytics-service
      dockerfile: Dockerfile
    container_name: nexora-analytics-engine
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nexora-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      analytics-engine:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/nexora_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver
      SPRING_DATASOURCE_USERNAME: nexora
      SPRING_DATASOURCE_PASSWORD: nexorapassword
      SPRING_JPA_DIALECT: org.hibernate.dialect.MySQLDialect
      ANALYTICS_SERVICE_URL: http://analytics-engine:8000
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nexora-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mysql_data:
