services:
  mysql:
    image: mysql:8.0
    container_name: nexora-mysql
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-nexoradb}
      MYSQL_USER: ${MYSQL_USER:-nexora_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-nexora_secure_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-nexora_root_secure_password}
    volumes:
      - nexora_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - nexora-net

  analytics:
    build:
      context: ./analytics-service
      dockerfile: Dockerfile
    container_name: nexora-analytics
    restart: unless-stopped
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - nexora-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nexora-backend
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-nexoradb}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-nexora_user}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-nexora_secure_password}
      SPRING_JPA_DIALECT: org.hibernate.dialect.MySQLDialect
      ANALYTICS_SERVICE_URL: http://analytics:8000
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    depends_on:
      mysql:
        condition: service_healthy
      analytics:
        condition: service_healthy
    volumes:
      - ./sample-data:/app/sample-data:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/api/v1/companies || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 40s
    networks:
      - nexora-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nexora-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - nexora-net

networks:
  nexora-net:
    driver: bridge

volumes:
  nexora_mysql_data:
    driver: local
